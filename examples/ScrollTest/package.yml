id: scroll-test
version: 1.0.0
type: application
dependencies:
  - id: am-lang-core
    type: local
    path: ../../../am-lang-core
  - id: am-ui
    type: local
    path: ../../
platforms:
  - id: libc
    abstract: true
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
  - id: macos-arm
    extends: libc
    gccCommand: gcc -O2
    gccAdditionalOptions:
      - -DAM_UI_LINUX_SDL_TTF
      - -I/opt/homebrew/include
    additionalLinkerFlags:
      - -L/opt/homebrew/lib
      - -lSDL2
      - -lSDL2_ttf
      - -framework
      - AppKit
  - id: linux-x64
    extends: libc
    gccCommand: gcc -O2
buildTargets:
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
  - id: macos-arm
    platform: macos-arm
    features: ["floatingPoint"]
  - id: linux-x64
    platform: linux-x64
    features: ["floatingPoint"]
