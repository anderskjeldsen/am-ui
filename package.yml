
id: am-ui
version: 0.10.0
type: library
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-lang-core.git
  - id: am-imaging
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-imaging.git
platforms:
  - id: libc
    abstract: true
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    asmCommand: vasmm68k_mot
    additionalHeaders:
    additionalAsmSources:
    additionalCSources: 
    additionalIncludePaths:
    gccAdditionalOptions:
      - -noixemul     
    additionalLinkerFlags:
      - -noixemul
    gccAdditionalLibraries:
  - id: morphos-ppc
    extends: libc
    gccCommand: ppc-morphos-gcc -O3
    additionalHeaders:
    additionalAsmSources:
    additionalCSources:
    additionalIncludePaths:
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
    gccAdditionalLibraries:
  # Headless platform that simulates AmigaOS graphics on linux-x64. Builds to a
  # 150x100 byte buffer instead of an OS window — used by the unit-test suite
  # to verify the layout / clip / paint pipeline. Despite the name it does NOT
  # cross-compile to AmigaOS; "sim" stands for simulator.
  - id: amigaos-sim
    extends: libc
    gccCommand: gcc
    additionalHeaders:
      - headless_painter.h
    additionalCSources:
      - inputFilename: headless_painter.c
        outputFilename: headless_painter.o
  # Apple Silicon desktop backend on SDL2. Single SDL2 native impl
  # under src/native-c/macos-arm/ — the same set of files would
  # land under macos/ and linux-x64/ when those targets are added
  # (SDL2 is the portable abstraction; nothing in the impl is
  # arm-specific).
  #
  # `-I/opt/homebrew/include` / `-L/opt/homebrew/lib` resolve the
  # Homebrew SDL2 install (`brew install sdl2 sdl2_ttf`).
  - id: macos-arm
    extends: libc
    gccCommand: gcc -O2
    gccAdditionalOptions:
      - -DAM_UI_LINUX_SDL_TTF
      - -I/opt/homebrew/include
    additionalLinkerFlags:
      - -L/opt/homebrew/lib
      - -lSDL2
      - -lSDL2_ttf
      # AppKit gives us NSMenu / NSApplication for the native menu bar
      # at the top of the screen. The bridge in Window.c uses the
      # Objective-C runtime through plain C (objc_msgSend) so no .m
      # file or extra build rule is needed.
      - -framework
      - AppKit
  # Linux desktop backend on SDL2 — same native impl as macos-arm
  # (src/native-c/linux-x64/, copied from macos-arm). The Cocoa menu
  # bridge + NSOpenPanel folder requester are gated behind __APPLE__,
  # so on linux those compile to no-op stubs; everything else is the
  # portable SDL2 path (AM_UI_LINUX_SDL_TTF selects SDL_ttf rendering).
  # Needs the SDL2 dev packages: `apt install libsdl2-dev libsdl2-ttf-dev`.
  # Headers are <SDL2/SDL.h>/<SDL2/SDL_ttf.h>, found via the default
  # /usr/include path, so no extra -I is required.
  - id: linux-x64
    extends: libc
    gccCommand: gcc -O2
    gccAdditionalOptions:
      - -DAM_UI_LINUX_SDL_TTF
      # AM_UI_LINUX_GTK switches Window.c to a GTK shell (real
      # GtkMenuBar) hosting the SDL renderer in a GtkDrawingArea.
      # Remove this one define to fall back to the pure-SDL window
      # (no menu bar). The -I list below is `pkg-config --cflags
      # gtk+-3.0` inlined (amlc YAML can't run pkg-config itself).
      - -DAM_UI_LINUX_GTK
      - -I/usr/include/gtk-3.0
      - -I/usr/include/pango-1.0
      - -I/usr/include/glib-2.0
      - -I/usr/lib/x86_64-linux-gnu/glib-2.0/include
      - -I/usr/include/harfbuzz
      - -I/usr/include/freetype2
      - -I/usr/include/libpng16
      - -I/usr/include/libmount
      - -I/usr/include/blkid
      - -I/usr/include/fribidi
      - -I/usr/include/cairo
      - -I/usr/include/pixman-1
      - -I/usr/include/gdk-pixbuf-2.0
      - -I/usr/include/x86_64-linux-gnu
      - -I/usr/include/webp
      - -I/usr/include/gio-unix-2.0
      - -I/usr/include/atk-1.0
      - -I/usr/include/at-spi2-atk/2.0
      - -I/usr/include/at-spi-2.0
      - -I/usr/include/dbus-1.0
      - -I/usr/lib/x86_64-linux-gnu/dbus-1.0/include
    # Use gccAdditionalLibraries (not additionalLinkerFlags) so amlc
    # places the -l flags AFTER the object files. GNU ld is link-order
    # sensitive — libs before the objects that reference them get
    # dropped (macOS's ld64 isn't, which is why macos-arm can use
    # additionalLinkerFlags). Matches how am-ssl/am-png declare libs.
    # GTK libs are `pkg-config --libs gtk+-3.0` inlined.
    gccAdditionalLibraries:
      - SDL2
      - SDL2_ttf
      - gtk-3
      - gdk-3
      - pangocairo-1.0
      - pango-1.0
      - harfbuzz
      - atk-1.0
      - cairo-gobject
      - cairo
      - gdk_pixbuf-2.0
      - gio-2.0
      - gobject-2.0
      - glib-2.0
  # Linux on PowerPC 32-bit. Same SDL2 native impl as linux-x64
  # (src/native-c/linux-ppc32/ is a copy of linux-x64 + the
  # macos-arm port). Targets Adélie Linux on PowerMac G5 in
  # 32-bit user-mode, cross-compiled via adelie-ppc-gcc:latest
  # (am-lang-compiler/docker/adelie-ppc/Dockerfile.gcc). Inside that
  # image `powerpc-linux-gnu-gcc` is a wrapper around
  # `zig cc -target powerpc-linux-musl --sysroot=/sysroot`.
  #
  # GTK is intentionally NOT linked — the IDE's GTK menu-bar
  # bridge is only on linux-x64 (and a fresh G5 install often
  # doesn't have gtk-3-dev anyway). The pure-SDL window path
  # works without it.
  - id: linux-ppc32
    extends: libc
    gccCommand: powerpc-linux-gnu-gcc -O2
    gccAdditionalOptions:
      - -DAM_UI_LINUX_SDL_TTF
    # See linux-x64 — GNU ld wants -l flags AFTER the objects, so
    # libraries go in gccAdditionalLibraries.
    gccAdditionalLibraries:
      - SDL2
      - SDL2_ttf
  # PowerPC 64-bit BE musl (Adélie ppc64 on G5 / Talos II).
  # Same SDL2/freetype/SDL_ttf stack; the docker image
  # (adelie-ppc64-gcc:latest) aliases `powerpc-linux-gnu-gcc` to a
  # zig wrapper that targets powerpc64-linux-musl with -mabi=elfv2.
  - id: linux-ppc64
    extends: linux-ppc32
    gccCommand: powerpc-linux-gnu-gcc -O2


buildTargets:
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
  - id: morphos-ppc_docker
    platform: morphos-ppc
    dockerBuild:
      image: amigadev/crosstools:ppc-morphos
      buildPath: /work
  - id: amigaos-sim
    platform: amigaos-sim
    features: ["floatingPoint"]
  - id: macos-arm
    platform: macos-arm
    features: ["floatingPoint"]
  - id: linux-x64
    platform: linux-x64
    features: ["floatingPoint"]
  - id: linux-ppc32
    platform: linux-ppc32
    features: ["floatingPoint"]

