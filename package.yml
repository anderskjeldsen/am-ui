
id: am-ui
version: 0.10.0
type: library
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-lang-core.git
  - id: am-imaging
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-imaging.git
platforms:
  - id: libc
    abstract: true
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    asmCommand: vasmm68k_mot
    additionalHeaders:
    additionalAsmSources:
    additionalCSources: 
    additionalIncludePaths:
    gccAdditionalOptions:
      - -noixemul     
    additionalLinkerFlags:
      - -noixemul
    gccAdditionalLibraries:
  - id: morphos-ppc
    extends: libc
    gccCommand: ppc-morphos-gcc -O3
    additionalHeaders:
    additionalAsmSources:
    additionalCSources:
    additionalIncludePaths:
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
    gccAdditionalLibraries:
  # Headless platform that simulates AmigaOS graphics on linux-x64. Builds to a
  # 150x100 byte buffer instead of an OS window — used by the unit-test suite
  # to verify the layout / clip / paint pipeline. Despite the name it does NOT
  # cross-compile to AmigaOS; "sim" stands for simulator.
  - id: amigaos-sim
    extends: libc
    gccCommand: gcc
    additionalHeaders:
      - headless_painter.h
    additionalCSources:
      - inputFilename: headless_painter.c
        outputFilename: headless_painter.o
  # Apple Silicon desktop backend on SDL2. Single SDL2 native impl
  # under src/native-c/macos-arm/ — the same set of files would
  # land under macos/ and linux-x64/ when those targets are added
  # (SDL2 is the portable abstraction; nothing in the impl is
  # arm-specific).
  #
  # `-I/opt/homebrew/include` / `-L/opt/homebrew/lib` resolve the
  # Homebrew SDL2 install (`brew install sdl2 sdl2_ttf`).
  - id: macos-arm
    extends: libc
    gccCommand: gcc -O2
    gccAdditionalOptions:
      - -DAM_UI_LINUX_SDL_TTF
      - -I/opt/homebrew/include
    additionalLinkerFlags:
      - -L/opt/homebrew/lib
      - -lSDL2
      - -lSDL2_ttf
      # AppKit gives us NSMenu / NSApplication for the native menu bar
      # at the top of the screen. The bridge in Window.c uses the
      # Objective-C runtime through plain C (objc_msgSend) so no .m
      # file or extra build rule is needed.
      - -framework
      - AppKit
  # Linux desktop backend on SDL2 — same native impl as macos-arm
  # (src/native-c/linux-x64/, copied from macos-arm). The Cocoa menu
  # bridge + NSOpenPanel folder requester are gated behind __APPLE__,
  # so on linux those compile to no-op stubs; everything else is the
  # portable SDL2 path (AM_UI_LINUX_SDL_TTF selects SDL_ttf rendering).
  # Needs the SDL2 dev packages: `apt install libsdl2-dev libsdl2-ttf-dev`.
  # Headers are <SDL2/SDL.h>/<SDL2/SDL_ttf.h>, found via the default
  # /usr/include path, so no extra -I is required.
  - id: linux-x64
    extends: libc
    gccCommand: gcc -O2
    gccAdditionalOptions:
      - -DAM_UI_LINUX_SDL_TTF
    # Use gccAdditionalLibraries (not additionalLinkerFlags) so amlc
    # places -lSDL2/-lSDL2_ttf AFTER the object files. GNU ld is
    # link-order sensitive — libs before the objects that reference
    # them get dropped (macOS's ld64 isn't, which is why macos-arm can
    # use additionalLinkerFlags). Matches how am-ssl/am-png declare
    # their libs.
    gccAdditionalLibraries:
      - SDL2
      - SDL2_ttf


buildTargets:
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
  - id: morphos-ppc_docker
    platform: morphos-ppc
    dockerBuild:
      image: amigadev/crosstools:ppc-morphos
      buildPath: /work
  - id: amigaos-sim
    platform: amigaos-sim
    features: ["floatingPoint"]
  - id: macos-arm
    platform: macos-arm
    features: ["floatingPoint"]
  - id: linux-x64
    platform: linux-x64
    features: ["floatingPoint"]

